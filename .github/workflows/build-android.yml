name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clean node_modules and package-lock
        run: rm -rf node_modules package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Verify React Native gradle files
        run: ls node_modules/react-native/gradle/libs.versions.toml

      - name: Install Expo CLI
        run: npm install -g expo-cli

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          android-version: 34
          build-tools-version: 34.0.0
          ndk-version: 25.2.9519653
          cmake-version: 3.22.1

      - name: Cache Expo modules
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            ~/.cache/expo
          key: ${{ runner.os }}-expo-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-expo-

      - name: Clean Android directory
        run: rm -rf android

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_NO_DEV_TOOLS: 1
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ steps.setup-android.outputs.ndk-version }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}

      - name: Rename APK
        run: |
          cd android/app/build/outputs/apk/debug
          mv app-debug.apk wora-mobile-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wora-mobile-debug-apk
          path: android/app/build/outputs/apk/debug/wora-mobile-debug.apk
          compression-level: 0
